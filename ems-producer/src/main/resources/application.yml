spring:
  application:
    name: spring-boot-ems
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://dev-56466430.okta.com/oauth2/ausnnzk61dE5M8SLz5d7/v1/keys #it provides the public key to verify the digital sign of incoming token
  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
  datasource:
    url: jdbc:postgresql://localhost:5432/ems_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
otp:
  max-otp-generation-attempts: 5
  max-verification-attempts: 3
  sliding-window-hours: 8
  verification-block-time-hours: 2
queue:
  name: ems-queue

server:
  port: 8081
  ssl:
    key-store: classpath:ems-keystore.jks
    key-store-password: changeit
    key-store-type: JKS
#    trust-store: classpath:ems-truststore.jks
#    trust-store-password: changeit
#    trust-store-type: JKS
#    enabled: true
#    client-auth: need
